<!-- 聯絡區塊 -->
<div class="contact-section">
    <div class="container">
        <h2 class="text-center">聯絡我</h2>
        <p class="text-center">如有任何問題或合作意向，歡迎填寫以下表單！</p>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">姓名</label>
                <input type="text" class="form-control" id="name" placeholder="請輸入您的姓名" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">電子郵件</label>
                <input type="email" class="form-control" id="email" placeholder="請輸入您的電子郵件" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">訊息</label>
                <textarea class="form-control" id="message" rows="4" placeholder="請輸入您的訊息" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">發送訊息</button>
        </form>
    </div>
